name: Validate research data
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'data/**'
      - 'research/**'
      - 'scripts/validate.js'
      - 'site/**'
      - 'index.html'
      - 'scripts/test-explorer.js'
      - '.github/workflows/research-data.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify research record integrity and source locations
        run: node scripts/validate.js
      - name: Check browser JavaScript syntax
        run: node --check site/app.js
      - name: Check explorer hooks and record navigation
        run: node scripts/test-explorer.js
